[mypy]
python_version = 3.14
pretty = True
show_error_codes = True
warn_unused_configs = True
explicit_package_bases = True
follow_imports = skip

files = custom_components/ha_inspector/engine/base_state.py,
        custom_components/ha_inspector/engine/backup_state.py,
        custom_components/ha_inspector/engine/storage_state.py,
        custom_components/ha_inspector/engine/recorder_state.py,
        custom_components/ha_inspector/engine/system_state.py,
        custom_components/ha_inspector/engine/entities_state.py,
        custom_components/ha_inspector/engine/integrations_state.py,
        custom_components/ha_inspector/engine/context.py,
        custom_components/ha_inspector/engine/inspector.py,
        custom_components/ha_inspector/engine/result.py,
        custom_components/ha_inspector/engine/analytics.py,
        custom_components/ha_inspector/engine/rule_engine.py,
        custom_components/ha_inspector/engine/score.py,
        custom_components/ha_inspector/engine/request.py,
        custom_components/ha_inspector/engine/rule_selector.py,
        custom_components/ha_inspector/engine/capabilities.py,
        custom_components/ha_inspector/engine/category.py,
        custom_components/ha_inspector/engine/descriptors.py,
        custom_components/ha_inspector/engine/profiles.py,
        custom_components/ha_inspector/engine/models.py,
        custom_components/ha_inspector/engine/severity.py,
        custom_components/ha_inspector/engine/comparison.py,
        custom_components/ha_inspector/engine/collectors/base.py,
        custom_components/ha_inspector/engine/collectors/backups.py,
        custom_components/ha_inspector/engine/collectors/storage.py,
        custom_components/ha_inspector/engine/collectors/system.py

strict = True

[mypy-homeassistant.*]
ignore_missing_imports = True