run:
  name: Ejecutar inspección
  description: >
    Ejecuta los recopiladores y las reglas activas de HA Inspector y devuelve
    el resultado completo de la inspección.
  fields:
    profile:
      name: Perfil
      description: >
        Perfil de inspección que se utilizará como base para la ejecución.
      required: false
      selector:
        select:
          options:
            - label: Completa
              value: full
            - label: Rápida
              value: quick
            - label: Sistema
              value: system
            - label: Entidades
              value: entities
            - label: Integraciones
              value: integrations
            - label: Registrador
              value: recorder
            - label: Almacenamiento
              value: storage
    diagnostics:
      name: Incluir diagnóstico
      description: >
        Incluye en la respuesta el contexto técnico recopilado.
      required: false
      default: false
      selector:
        boolean:
    language:
      name: Idioma
      description: >
        Idioma de los avisos, recomendaciones y resultados. Si no se indica,
        se utiliza el idioma configurado en Home Assistant.
      required: false
      selector:
        select:
          options:
            - label: Español
              value: es
            - label: English
              value: en

list_profiles:
  name: Listar perfiles
  description: >
    Devuelve los perfiles de inspección disponibles en HA Inspector.

describe_profile:
  name: Describir perfil
  description: >
    Devuelve la definición completa de un perfil de inspección.
  fields:
    profile_id:
      name: ID del perfil
      description: Identificador del perfil de inspección.
      required: true
      selector:
        text:

info:
  name: Información del motor
  description: >
    Devuelve información sobre el motor de HA Inspector.
  response:
    optional: false
