run:
  name: Ejecutar inspección
  description: >
    Ejecuta los collectors y las reglas activas de HA Inspector y devuelve
    el resultado completo de la inspección.
  fields:
    diagnostics:
      name: Incluir diagnóstico
      description: >
        Incluye en la respuesta el contexto técnico recopilado.
      required: false
      default: false
      selector:
        boolean:

list_profiles:
  name: Listar perfiles
  description: >
    Devuelve los perfiles de inspección disponibles en HA Inspector.

describe_profile:
  name: Describe profile
  description: >
    Return the complete definition of an inspection profile.
  fields:
    profile_id:
      name: Profile ID
      description: Identifier of the inspection profile.
      required: true
      selector:
        text:

info:
  name: Engine information
  description: Return information about the HA Inspector engine.
  response:
    optional: false