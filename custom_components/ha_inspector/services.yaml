run:
  name: Ejecutar inspección
  description: >
    Ejecuta los recopiladores y las reglas activas de HA Inspector y devuelve
    el resultado completo de la inspección.
  fields:
    profile:
      name: Perfil
      description: >
        Perfil de inspección que se utilizará como base para la ejecución.
      required: false
      selector:
        select:
          options:
            - label: Completa
              value: full
            - label: Rápida
              value: quick
            - label: Sistema
              value: system
            - label: Entidades
              value: entities
            - label: Integraciones
              value: integrations
            - label: Registrador
              value: recorder
            - label: Almacenamiento
              value: storage
            - label: Previa a actualización
              value: pre_upgrade
            - label: Posterior a restauración
              value: post_restore
            - label: Dependencias
              value: dependencies
    diagnostics:
      name: Incluir diagnóstico
      description: >
        Incluye en la respuesta el contexto técnico recopilado.
      required: false
      default: false
      selector:
        boolean:
    language:
      name: Idioma
      description: >
        Idioma de los avisos, recomendaciones y resultados. Si no se indica,
        se utiliza el idioma configurado en Home Assistant.
      required: false
      selector:
        select:
          options:
            - label: Español
              value: es
            - label: English
              value: en

list_profiles:
  name: Listar perfiles
  description: >
    Devuelve los perfiles de inspección disponibles en HA Inspector.

describe_profile:
  name: Describir perfil
  description: >
    Devuelve la definición completa de un perfil de inspección.
  fields:
    profile_id:
      name: ID del perfil
      description: Identificador del perfil de inspección.
      required: true
      selector:
        text:

info:
  name: Información del motor
  description: >
    Devuelve información sobre el motor de HA Inspector.
  response:
    optional: false

list_acknowledgements:
  name: Listar reconocimientos
  description: >
    Devuelve los identificadores de findings reconocidos y actualmente
    suprimidos en las inspecciones de HA Inspector.
  response:
    optional: false

acknowledge_finding:
  name: Reconocer finding
  description: >
    Reconoce de forma persistente un finding para que deje de afectar al
    resultado y a la puntuación de salud de futuras inspecciones.
  fields:
    finding_id:
      name: ID del finding
      description: Identificador exacto del finding que se desea reconocer.
      required: true
      selector:
        text:
  response:
    optional: false

clear_acknowledgement:
  name: Quitar reconocimiento
  description: >
    Elimina el reconocimiento persistente de un finding para que vuelva a
    aparecer como activo si una regla lo genera.
  fields:
    finding_id:
      name: ID del finding
      description: Identificador exacto del finding cuyo reconocimiento se elimina.
      required: true
      selector:
        text:
  response:
    optional: false

clear_acknowledgements:
  name: Limpiar reconocimientos
  description: >
    Elimina todos los reconocimientos persistentes de findings de HA Inspector.
  response:
    optional: false

export_diagnostic_report:
  name: Exportar informe de diagnóstico
  description: >
    Devuelve un informe de diagnóstico exportable basado en el último
    resultado de inspección disponible. El informe incluye estado de salud,
    findings y métricas operativas, y excluye el contexto técnico sin filtrar.
  response:
    optional: false


dependency_diagnostics:
  name: Diagnóstico de dependencias
  description: >
    Devuelve el resumen compacto de dependencias del último resultado de
    inspección disponible, incluyendo entidades afectadas, estados
    problemáticos, prioridades e impacto máximo.
  response:
    optional: false

entity_dependency:
  name: Dependencias de entidad
  description: >
    Devuelve las referencias actuales de automatizaciones, scripts y escenas
    que utilizan una entidad, separando configuraciones activas y deshabilitadas.
    También indica si la entidad existe actualmente en Home Assistant y, para
    referencias obsoletas, puede incluir una recomendación de limpieza segura
    sin realizar cambios automáticos en la configuración.
  fields:
    entity_id:
      name: ID de entidad
      description: >
        Identificador de la entidad que se desea investigar. Puede ser también
        una entidad inexistente para localizar referencias obsoletas.
      required: true
      selector:
        text:
  response:
    optional: false
